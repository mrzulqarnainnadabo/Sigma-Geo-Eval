name: Python checks and submission package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run reference pipeline
        run: python run_eval.py --adapter reference
      - name: Build code-only submission ZIP
        if: github.event_name == 'push'
        run: zip -r SIGMA-GEO-submission.zip README.md pyproject.toml run_eval.py sigma_geo tests docs results
      - name: Upload submission ZIP
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: SIGMA-GEO-submission
          path: SIGMA-GEO-submission.zip
          if-no-files-found: error
          retention-days: 7
